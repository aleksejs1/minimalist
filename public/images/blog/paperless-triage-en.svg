<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.04" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#18181b" />
    </marker>
    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        fill: #18181b;
      }
      .text-cat {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        fill: #71717a;
      }
      .text-body-bold {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15.5px;
        font-weight: 600;
        fill: #18181b;
      }
      .text-body-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        fill: #52525b;
      }
      .box {
        fill: #ffffff;
        stroke: #18181b;
        stroke-width: 1.25;
        rx: 12px;
        ry: 12px;
      }
      .connector {
        stroke: #18181b;
        stroke-width: 1.25;
        fill: none;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="840" height="480" rx="16" fill="url(#bgGradient)" stroke="#d4d4d8" stroke-width="1" />

  <!-- Connecting Lines -->
  <!-- From Root down to branch point -->
  <line x1="420" y1="88" x2="420" y2="124" class="connector" />
  <!-- Horizontal Bus -->
  <line x1="165" y1="124" x2="675" y2="124" class="connector" />
  <!-- Branch to Col 1 -->
  <line x1="165" y1="124" x2="165" y2="165" class="connector" marker-end="url(#arrow)" />
  <!-- Branch to Col 2 -->
  <line x1="420" y1="124" x2="420" y2="165" class="connector" marker-end="url(#arrow)" />
  <!-- Branch to Col 3 -->
  <line x1="675" y1="124" x2="675" y2="165" class="connector" marker-end="url(#arrow)" />

  <!-- Vertical connectors from Row 2 to Row 3 -->
  <line x1="165" y1="270" x2="165" y2="335" class="connector" marker-end="url(#arrow)" />
  <line x1="420" y1="270" x2="420" y2="335" class="connector" marker-end="url(#arrow)" />
  <line x1="675" y1="270" x2="675" y2="335" class="connector" marker-end="url(#arrow)" />

  <!-- ROOT NODE -->
  <rect x="280" y="34" width="280" height="54" class="box" filter="url(#cardShadow)" />
  <text x="420" y="68" text-anchor="middle" class="text-title">INCOMING PAPER</text>

  <!-- ROW 2: CATEGORIES -->
  <!-- Col 1: Category 1 -->
  <rect x="47" y="165" width="236" height="105" class="box" filter="url(#cardShadow)" />
  <text x="165" y="198" text-anchor="middle" class="text-cat">CATEGORY 1</text>
  <text x="165" y="227" text-anchor="middle" class="text-body-bold">Essential Originals</text>
  <text x="165" y="251" text-anchor="middle" class="text-body-sub">(Wet-ink &amp; Legal)</text>

  <!-- Col 2: Category 2 -->
  <rect x="302" y="165" width="236" height="105" class="box" filter="url(#cardShadow)" />
  <text x="420" y="198" text-anchor="middle" class="text-cat">CATEGORY 2</text>
  <text x="420" y="227" text-anchor="middle" class="text-body-bold">Scan &amp; Shred</text>
  <text x="420" y="251" text-anchor="middle" class="text-body-sub">(Informational)</text>

  <!-- Col 3: Category 3 -->
  <rect x="557" y="165" width="236" height="105" class="box" filter="url(#cardShadow)" />
  <text x="675" y="198" text-anchor="middle" class="text-cat">CATEGORY 3</text>
  <text x="675" y="227" text-anchor="middle" class="text-body-bold">Instant Trash</text>
  <text x="675" y="251" text-anchor="middle" class="text-body-sub">(Zero Value)</text>

  <!-- ROW 3: DESTINATIONS -->
  <!-- Col 1: Fireproof Binder -->
  <rect x="47" y="335" width="236" height="105" class="box" filter="url(#cardShadow)" />
  <text x="165" y="380" text-anchor="middle" class="text-body-bold">Fireproof A4 Binder</text>
  <text x="165" y="405" text-anchor="middle" class="text-body-sub">(Single Family Vault)</text>

  <!-- Col 2: Searchable PDF/A -->
  <rect x="302" y="335" width="236" height="105" class="box" filter="url(#cardShadow)" />
  <text x="420" y="380" text-anchor="middle" class="text-body-bold">Searchable PDF/A</text>
  <text x="420" y="405" text-anchor="middle" class="text-body-sub">(Encrypted Local Vault)</text>

  <!-- Col 3: Recycling Bin -->
  <rect x="557" y="335" width="236" height="105" class="box" filter="url(#cardShadow)" />
  <text x="675" y="380" text-anchor="middle" class="text-body-bold">Recycling Bin</text>
  <text x="675" y="405" text-anchor="middle" class="text-body-sub">(Right Away)</text>
</svg>
