<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.04" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#18181b" />
    </marker>
    <style>
      .text-step {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        fill: #71717a;
      }
      .text-body-bold {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        fill: #18181b;
      }
      .text-body-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #52525b;
      }
      .box {
        fill: #ffffff;
        stroke: #18181b;
        stroke-width: 1.25;
        rx: 12px;
        ry: 12px;
      }
      .box-accent {
        fill: #18181b;
        stroke: #18181b;
        stroke-width: 1.25;
        rx: 12px;
        ry: 12px;
      }
      .text-invert-bold {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        fill: #ffffff;
      }
      .text-invert-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #d4d4d8;
      }
      .connector {
        stroke: #18181b;
        stroke-width: 1.25;
        fill: none;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="840" height="460" rx="16" fill="url(#bgGradient)" stroke="#d4d4d8" stroke-width="1" />

  <!-- Top Pipeline Row -->
  <!-- Step 1: Doubtful Item -->
  <rect x="40" y="45" width="215" height="90" class="box" filter="url(#cardShadow)" />
  <text x="147" y="73" text-anchor="middle" class="text-step">ШАГ 1: СОМНЕНИЕ</text>
  <text x="147" y="98" text-anchor="middle" class="text-body-bold">Спорный предмет</text>
  <text x="147" y="119" text-anchor="middle" class="text-body-sub">(«Жалко выбросить»)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="255" y1="90" x2="308" y2="90" class="connector" marker-end="url(#arrow)" />

  <!-- Step 2: Seal & Date -->
  <rect x="313" y="45" width="214" height="90" class="box" filter="url(#cardShadow)" />
  <text x="420" y="73" text-anchor="middle" class="text-step">ШАГ 2: БУФЕР</text>
  <text x="420" y="98" text-anchor="middle" class="text-body-bold">Заклеить (+90–180 дней)</text>
  <text x="420" y="119" text-anchor="middle" class="text-body-sub">(Убрать с глаз долой)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="527" y1="90" x2="580" y2="90" class="connector" marker-end="url(#arrow)" />

  <!-- Step 3: Time Trial -->
  <rect x="585" y="45" width="215" height="90" class="box" filter="url(#cardShadow)" />
  <text x="692" y="73" text-anchor="middle" class="text-step">ШАГ 3: ПРОВЕРКА БЫТОМ</text>
  <text x="692" y="98" text-anchor="middle" class="text-body-bold">Доставали ли вещь?</text>
  <text x="692" y="119" text-anchor="middle" class="text-body-sub">(За 3–6 месяцев жизни)</text>

  <!-- Connectors from Step 3 down to Outcomes -->
  <line x1="692" y1="135" x2="692" y2="180" class="connector" />
  <line x1="250" y1="180" x2="692" y2="180" class="connector" />
  <line x1="250" y1="180" x2="250" y2="225" class="connector" marker-end="url(#arrow)" />
  <line x1="590" y1="180" x2="590" y2="225" class="connector" marker-end="url(#arrow)" />

  <!-- Branch Labels -->
  <rect x="210" y="166" width="80" height="26" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
  <text x="250" y="184" text-anchor="middle" class="text-step" fill="#18181b">ДА (~5%)</text>

  <rect x="550" y="166" width="80" height="26" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1" />
  <text x="590" y="184" text-anchor="middle" class="text-step" fill="#18181b">НЕТ (~95%)</text>

  <!-- Outcome 1: YES -->
  <rect x="95" y="230" width="310" height="95" class="box" filter="url(#cardShadow)" />
  <text x="250" y="262" text-anchor="middle" class="text-step">ДОКАЗАННАЯ ПОЛЬЗА</text>
  <text x="250" y="287" text-anchor="middle" class="text-body-bold">Вернуть в активный быт</text>
  <text x="250" y="309" text-anchor="middle" class="text-body-sub">(Вещь заслужила свое место в доме)</text>

  <!-- Outcome 2: NO -->
  <rect x="435" y="230" width="310" height="95" class="box-accent" filter="url(#cardShadow)" />
  <text x="590" y="262" text-anchor="middle" class="text-step" fill="#a1a1aa">ИЛЛЮЗИЯ НУЖНОСТИ</text>
  <text x="590" y="287" text-anchor="middle" class="text-invert-bold">Отдать не открывая</text>
  <text x="590" y="309" text-anchor="middle" class="text-invert-sub">(Отпустить без повторных торгов с собой)</text>

  <!-- Bottom Golden Rule Banner -->
  <rect x="95" y="365" width="650" height="58" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.25" />
  <text x="420" y="391" text-anchor="middle" class="text-body-bold">ЗОЛОТОЕ ПРАВИЛО: НЕ ВСКРЫВАЙТЕ КОРОБКУ ПО ИСТЕЧЕНИИ СРОКА</text>
  <text x="420" y="411" text-anchor="middle" class="text-body-sub">Если вещь не понадобилась за полгода, взгляд на нее лишь заново включит «эффект владения».</text>
</svg>
